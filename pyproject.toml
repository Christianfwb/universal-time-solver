[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-time-solver"
version = "0.5.0"
description = "A time, frequency, mass and photon-energy toolkit with an exploratory ontology layer."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Christian Berrang" }]
keywords = ["physics", "time", "frequency", "mass", "ontology", "ai-ethics"]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2", "uvicorn>=0.29"]
test = ["httpx>=0.27", "pytest>=8", "ruff>=0.6", "jsonschema>=4.18"]
notebook = ["nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6", "ipywidgets>=8"]

[project.scripts]
universal-time-solver = "universal_time_solver.__main__:main"

[project.urls]
Homepage = "https://github.com/Christianfwb/universal-time-solver"
Repository = "https://github.com/Christianfwb/universal-time-solver"
Issues = "https://github.com/Christianfwb/universal-time-solver/issues"

[tool.setuptools]
package-dir = { "" = "universal_time_solver" }

[tool.setuptools.packages.find]
where = ["universal_time_solver"]

[tool.setuptools.package-data]
universal_time_solver = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]